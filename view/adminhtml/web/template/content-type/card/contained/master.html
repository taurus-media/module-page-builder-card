<div attr="data.main.attributes" css="data.main.css" ko-style="data.main.style">
    <a attr="data.link.attributes">
        <div class="image pagebuilder-image" if="data.desktop_image.attributes().src">
            <picture>
               <source if="data.mobile_image.attributes().src" media="(max-width: 767px)" srcset="data.mobile_image.attributes().src" />
               <img attr="data.desktop_image.attributes" />
            </picture>
        </div>
        <div class="content">
            <div class="title" if="data.title.html">
                <span attr="data.title.attributes" html="data.title.html"></span>
            </div>
            <div class="content-inner">
                <div class="description"
                     if="data.description.html"
                     attr="data.description.attributes"
                     html="data.description.html"
                ></div>
                <div class="actions" if="data.link_text.html">
                    <span attr="data.link_text.attributes" html="data.link_text.html"></span>
                </div>
            </div>
        </div>
    </a>
</div>
